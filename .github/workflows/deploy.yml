# Bygger, tester og publiserer appen til GitHub Pages ved hver push til main.
# Engangsoppsett i GitHub: Settings → Pages → Source: «GitHub Actions».
name: Publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Tilbakemeldingsknappen i appen åpner et nytt «issue» i dette repoet.
          VITE_FEEDBACK_URL: https://github.com/${{ github.repository }}/issues/new
          # Publiser-knappen i appen skriver til dette repoet.
          VITE_GITHUB_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
